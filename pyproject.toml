[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "memolite"
version = "0.1.0"
description = "Single file SQLite memory for AI agents. Offline FTS5 hybrid, session aware, thread safe, WAL durable."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
keywords = ["agents", "memory", "sqlite", "rag", "llm", "context"]
authors = [{ name = "mastaan66", email = "mastaan66@github" }]
maintainers = [{ name = "mastaan66" }]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
local = ["sentence-transformers>=3.0", "numpy>=1.24"]
openai = ["openai>=1.30", "numpy>=1.24"]
vec = ["sqlite-vec>=0.1.6"]
mcp = ["mcp>=1.0"]
security = ["cryptography>=41"]
all = ["memolite[local,openai,vec,mcp,security]"]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "pytest-asyncio>=0.23",
  "ruff>=0.8",
  "mypy>=1.11",
  "pre-commit>=3.6",
  "types-setuptools",
]

[project.urls]
Homepage = "https://github.com/mastaan66/memolite"
Repository = "https://github.com/mastaan66/memolite"
Issues = "https://github.com/mastaan66/memolite/issues"
Changelog = "https://github.com/mastaan66/memolite/blob/main/CHANGELOG.md"

[project.scripts]
memolite = "memolite.cli:main"
memolite-mcp = "memolite.mcp_server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/memolite"]

[tool.hatch.build.force-include]
"src/memolite/skills" = "memolite/skills"
"AGENTS.md" = "memolite/AGENTS.md"
"llms.txt" = "memolite/llms.txt"

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "C4", "UP", "SIM", "RUF"]
ignore = ["SIM105", "E501"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.mypy]
python_version = "3.10"
strict = true
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
exclude = ["tests", "examples"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "--cov=memolite --cov-report=term-missing --cov-report=html"

[tool.coverage.run]
source = ["src/memolite"]
branch = true
omit = ["src/memolite/embedder.py", "src/memolite/mcp_server.py"]

[tool.coverage.report]
fail_under = 80
show_missing = true
